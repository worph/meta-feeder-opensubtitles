[package]
name = "opensubtitles-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# OpenSubtitles subtitles. Answers `fileType:subtitle` queries — keyword and
# id-anchored — with `provider-file` (0x100A) locator records (free), and
# REDEEMS those locators through `/compute` with an account login (`/download`,
# which spends the account's download quota) when the gateway asks on a play.

[lib]
name = "opensubtitles_feeder"
path = "src/lib.rs"

[[bin]]
name = "opensubtitles-feeder"
path = "src/main.rs"

[dependencies]
# Pinned by TAG, never by path. A path dep resolves OUTSIDE this repo, and this
# repo is the Docker build context — see meta-feeder-anilist's manifest.
meta-feeder-sdk = { git = "https://github.com/worph/meta-feeder-sdk", tag = "v1.2.2" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
base64 = "0.22"
tokio = { version = "1.40", features = ["full", "test-util"] }
